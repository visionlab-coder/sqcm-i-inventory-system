name: release-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sqcm-i-inventory-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
      - name: Attest backend image
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sqcm-i-inventory-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Build and publish frontend image
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sqcm-i-inventory-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
      - name: Attest frontend image
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sqcm-i-inventory-frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
