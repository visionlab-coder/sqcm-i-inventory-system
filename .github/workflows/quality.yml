name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  three-tier-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start frontend, backend and PostgreSQL
        run: docker compose -f compose.yaml -f compose.test.yaml up -d --build --wait
      - name: Run required integration tests
        env:
          INTEGRATION_BASE_URL: http://localhost:3000
          INTEGRATION_DATABASE_URL: postgres://seowon:change-me@localhost:55432/seowon_inventory
          SEED_MANAGER_PASSWORD: Manager1234!
          SEED_ADMIN_PASSWORD: Admin1234!
        run: npm run test:integration
      - name: Capture service state and logs
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.test.yaml ps
          docker compose -f compose.yaml -f compose.test.yaml logs --no-color --tail 200
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down -v
