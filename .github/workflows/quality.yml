name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run operations:contracts
      - run: npm run compose:contract
      - run: npm run repository:hygiene

  three-tier-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate ephemeral test credentials
        run: npm run ci:env
      - name: Start frontend, backend and PostgreSQL
        run: docker compose -f compose.yaml -f compose.test.yaml up -d --build --wait
      - name: Run required integration tests
        env:
          INTEGRATION_BASE_URL: http://localhost:3000
        run: npm run test:integration
      - name: Run nonfunctional quality gate
        env:
          NONFUNCTIONAL_BASE_URL: http://localhost:3000
        run: npm run test:nonfunctional
      - name: Verify database dependency recovery
        env:
          ALLOW_DATABASE_PAUSE: "true"
          RECOVERY_BASE_URL: http://localhost:3000
          RECOVERY_COMPOSE_FILES: compose.yaml,compose.test.yaml
        run: npm run test:recovery
      - name: Capture service state and logs
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.test.yaml ps
          docker compose -f compose.yaml -f compose.test.yaml logs --no-color --tail 200
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down -v
