services:
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://seowon:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/seowon_inventory
      DB_AUTO_MIGRATE: "false"
      DB_RUN_SEEDS: "false"
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      AUTOMATION_WORKER_ENABLED: "true"
      AUTOMATION_WORKER_INTERVAL_MS: ${AUTOMATION_WORKER_INTERVAL_MS:-60000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:?FILE_STORAGE_DRIVER is required}
      MALWARE_SCAN_DRIVER: ${MALWARE_SCAN_DRIVER:?MALWARE_SCAN_DRIVER is required}
      AUTH_PROVIDER: ${AUTH_PROVIDER:?AUTH_PROVIDER is required}
      OPERATIONAL_ADAPTER_MODULE: ${OPERATIONAL_ADAPTER_MODULE:?OPERATIONAL_ADAPTER_MODULE is required}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI is required}
      OIDC_ALLOW_EMAIL_LINKING: ${OIDC_ALLOW_EMAIL_LINKING:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
