<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서원토건 비품관리</title>
  <link rel="stylesheet" href="/styles.css?v=20260807-p1">
  <link rel="stylesheet" href="/brand.css?v=20260807-p1">
  <link rel="stylesheet" href="/experience.css?v=20260807-p2">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <section id="login-page" class="login-page">
    <div class="login-visual">
      <img class="official-logo login-logo" src="/assets/seowon-official-logo-reversed.png" alt="SEOWON Since 1991">
      <h1>서원토건 비품관리</h1>
      <p>안전한 현장 운영을 위한 통합 비품관리 시스템</p>
    </div>
    <div class="login-panel">
      <form id="login-form" class="login-form">
        <p class="eyebrow">ASSET CONTROL</p>
        <h2>로그인</h2>
        <p class="muted">등록된 계정으로 업무를 시작하세요.</p>
        <div id="login-error" class="alert error hidden" role="alert"></div>
        <label>이메일<input type="email" name="email" autocomplete="username" required placeholder="name@seowon.local"></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" minlength="10" required></label>
        <button class="primary full" type="submit">로그인</button>
      </form>
      <form id="invitation-form" class="login-form hidden">
        <p class="eyebrow">ACCOUNT ACTIVATION</p>
        <h2>초대 계정 활성화</h2>
        <p class="muted">12자 이상이며 대문자·소문자·숫자·특수문자를 포함한 비밀번호를 설정하세요.</p>
        <div id="invitation-error" class="alert error hidden" role="alert"></div>
        <input type="hidden" name="token">
        <label>새 비밀번호<input type="password" name="newPassword" autocomplete="new-password" minlength="12" required></label>
        <label>비밀번호 확인<input type="password" name="passwordConfirm" autocomplete="new-password" minlength="12" required></label>
        <button class="primary full" type="submit">계정 활성화</button>
        <button class="link full" id="invitation-back" type="button">로그인으로 돌아가기</button>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><img class="official-logo sidebar-logo" src="/assets/seowon-official-logo-reversed.png" alt="SEOWON Since 1991"><strong>비품관리</strong></div>
      <nav aria-label="주 메뉴">
        <button data-view="dashboard" class="active">대시보드</button>
        <button data-view="assets">자산 목록</button>
        <button data-view="asset-register" data-manager-only>자산 등록</button>
        <button data-view="assignments">배정·반납</button>
        <button data-view="requests">요청함</button>
        <button data-view="stocktakes" data-manager-only>재물조사</button>
        <button data-view="repairs">수리 관리</button>
        <button data-view="reports" data-manager-only>보고서</button>
        <button data-view="admin" data-admin-only>관리자</button>
        <button data-view="audit" id="audit-nav">감사 로그</button>
      </nav>
      <div class="user-box"><strong id="user-name"></strong><span id="user-role"></span><button id="logout-button">로그아웃</button></div>
    </aside>
    <div class="content-wrap">
      <header class="topbar"><span class="mobile-title">서원토건 비품관리</span><span id="top-user"></span></header>
      <main id="main" class="main-content" tabindex="-1">
        <div id="global-message" class="alert hidden" role="status"></div>
        <div id="view-root" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <script src="/app.js?v=20260807-p4" defer></script>
</body>
</html>
