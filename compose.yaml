services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seowon_inventory
      POSTGRES_USER: seowon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/new-local-env.ps1 or provide POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seowon -d seowon_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-seowon-inventory-backend}:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      DATABASE_URL: postgres://seowon:${POSTGRES_PASSWORD:?Run scripts/new-local-env.ps1}@database:5432/seowon_inventory
      SESSION_SECRET: ${SESSION_SECRET:?Run scripts/new-local-env.ps1 or provide SESSION_SECRET}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      DB_RUN_SEEDS: ${DB_RUN_SEEDS:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Run scripts/new-local-env.ps1}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:?Run scripts/new-local-env.ps1}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?Run scripts/new-local-env.ps1}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
      FILE_STORAGE_ROOT: /app/data/uploads
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-5242880}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      PRODUCTION_LOCAL_AUTH_MFA_REQUIRED: ${PRODUCTION_LOCAL_AUTH_MFA_REQUIRED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      AI_PROVIDER_DRIVER: ${AI_PROVIDER_DRIVER:-rules}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
      AI_PROVIDER_OCR_URL: ${AI_PROVIDER_OCR_URL:-}
      AI_PROVIDER_HEALTH_URL: ${AI_PROVIDER_HEALTH_URL:-}
      AI_PROVIDER_READY_URL: ${AI_PROVIDER_READY_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_API_KEY_FILE: ${AI_PROVIDER_API_KEY_FILE:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-cost-control-v1}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-external-http}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-12000}
      MALWARE_SCAN_DRIVER: ${MALWARE_SCAN_DRIVER:-mock}
      MALWARE_SCANNER_URL: ${MALWARE_SCANNER_URL:-}
      MALWARE_SCANNER_HEALTH_URL: ${MALWARE_SCANNER_HEALTH_URL:-}
      MALWARE_SCANNER_API_KEY: ${MALWARE_SCANNER_API_KEY:-}
      MALWARE_SCANNER_API_KEY_FILE: ${MALWARE_SCANNER_API_KEY_FILE:-}
      ALERTING_URL: ${ALERTING_URL:-}
      ALERTING_API_KEY: ${ALERTING_API_KEY:-}
      ALERTING_API_KEY_FILE: ${ALERTING_API_KEY_FILE:-}
      OPERATIONAL_ADAPTER_MODULE: ${OPERATIONAL_ADAPTER_MODULE:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_ACCESS_KEY_ID_FILE: ${STORAGE_S3_ACCESS_KEY_ID_FILE:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_SECRET_ACCESS_KEY_FILE: ${STORAGE_S3_SECRET_ACCESS_KEY_FILE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_ALLOW_EMAIL_LINKING: ${OIDC_ALLOW_EMAIL_LINKING:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      EVENT_PUBLISHER_URL: ${EVENT_PUBLISHER_URL:-}
      EVENT_PUBLISHER_API_KEY: ${EVENT_PUBLISHER_API_KEY:-}
      EVENT_PUBLISHER_API_KEY_FILE: ${EVENT_PUBLISHER_API_KEY_FILE:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
    volumes:
      - file-data:/app/data/uploads
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-seowon-inventory-frontend}:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  file-data:
