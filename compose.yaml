services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seowon_inventory
      POSTGRES_USER: seowon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seowon -d seowon_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://seowon:${POSTGRES_PASSWORD:-change-me}@postgres:5432/seowon_inventory
      SESSION_SECRET: ${SESSION_SECRET:-local-compose-secret-change-before-production}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin1234!}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-Manager1234!}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:
