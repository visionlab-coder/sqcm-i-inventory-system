services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seowon_inventory
      POSTGRES_USER: seowon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seowon -d seowon_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: seowon-inventory-backend:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      DATABASE_URL: postgres://seowon:${POSTGRES_PASSWORD:-change-me}@database:5432/seowon_inventory
      SESSION_SECRET: ${SESSION_SECRET:-local-compose-secret-change-before-production}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin1234!}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-Manager1234!}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Employee1234!}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
      FILE_STORAGE_ROOT: /app/data/uploads
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-5242880}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      MALWARE_SCAN_DRIVER: ${MALWARE_SCAN_DRIVER:-mock}
      OPERATIONAL_ADAPTER_MODULE: ${OPERATIONAL_ADAPTER_MODULE:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_ALLOW_EMAIL_LINKING: ${OIDC_ALLOW_EMAIL_LINKING:-false}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
    volumes:
      - file-data:/app/data/uploads
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: seowon-inventory-frontend:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  file-data:
