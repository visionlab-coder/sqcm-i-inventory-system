services:
  backend:
    environment:
      NODE_ENV: staging
      DB_AUTO_MIGRATE: "true"
      DB_RUN_SEEDS: "true"
      COOKIE_SECURE: "false"
      FILE_STORAGE_DRIVER: local
      AUTH_PROVIDER: local

  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3100}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./frontend/nginx.staging.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
